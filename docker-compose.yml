version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: nourishtrack-db
    environment:
      POSTGRES_USER: nourishtrack
      POSTGRES_PASSWORD: nourishtrack_secret
      POSTGRES_DB: nourishtrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nourishtrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nourishtrack-api
    environment:
      DATABASE_URL: postgresql+asyncpg://nourishtrack:nourishtrack_secret@db:5432/nourishtrack
      SECRET_KEY: super-secret-key-change-in-production
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nourishtrack-ui
    environment:
      REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  pgdata:
